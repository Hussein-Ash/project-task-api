services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: projecttaskapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Published on 5433 so the container does not collide with a PostgreSQL install
    # already occupying the host's default 5432. Inside the compose network the api
    # service still reaches it on 5432 via the "db" hostname.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d projecttaskapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/ProjectTaskApi.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=projecttaskapi;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
